/* MANHWA HUB CMS — visual refresh */
:root{
 --bg:#080d19;--panel:#101a2b;--panel2:#17243a;--line:#263752;
 --text:#f4f7ff;--muted:#9aaac2;--accent:#9d83ff;--green:#48d6a5;
 --red:#ff7187;--amber:#f5c16b;
}
html{scroll-behavior:smooth}
body{
 background:
  radial-gradient(ellipse at 8% 0%,rgba(111,82,220,.20),transparent 34rem),
  radial-gradient(ellipse at 100% 18%,rgba(36,132,180,.10),transparent 30rem),
  var(--bg);
 letter-spacing:.01em;
}
.top{
 height:76px;padding:0 clamp(18px,3vw,42px);
 background:rgba(8,13,25,.82);border-bottom:1px solid rgba(137,158,193,.16);
 box-shadow:0 8px 30px rgba(0,0,0,.14);
}
.brand{font-size:20px;letter-spacing:-.8px}
.brand span{background:linear-gradient(100deg,#c3b2ff,#8b9cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.topright{font-size:12px}
.layout{max-width:1580px;padding:30px clamp(16px,3vw,42px);grid-template-columns:248px minmax(0,1fr);gap:26px}
.sidebar{
 top:96px;padding:14px;background:rgba(15,24,41,.82);
 border:1px solid rgba(137,158,193,.17);border-radius:20px;
 box-shadow:0 18px 50px rgba(0,0,0,.20);backdrop-filter:blur(18px)
}
.navlabel{padding:15px 12px 9px;color:#7184a5;font-size:10px;letter-spacing:1.7px}
.navbtn{
 min-height:46px;padding:12px 14px;margin:4px 0;border-radius:12px;
 color:#aebbd1;font-size:13px;font-weight:650;transition:background .18s,border-color .18s,transform .18s;
 border:1px solid transparent;
}
.navbtn:hover{background:rgba(141,119,232,.10);color:#fff;transform:translateX(2px)}
.navbtn.active{
 background:linear-gradient(110deg,rgba(137,105,239,.23),rgba(83,116,191,.10));
 color:#fff;border-color:rgba(166,144,255,.25);
 box-shadow:inset 3px 0 #aa91ff,0 7px 22px rgba(0,0,0,.12)
}
.content{min-width:0;animation:cmsIn .24s ease-out}
@keyframes cmsIn{from{opacity:.65;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.pagehead{align-items:center;margin:4px 0 26px}
.eyebrow{font-size:10px;letter-spacing:2px;color:#b6a3ff}
.pagehead h1{font-size:clamp(26px,3vw,34px);letter-spacing:-1.3px;margin:8px 0 6px}
.sub{font-size:13px;max-width:720px}
.btn{
 border:1px solid rgba(139,160,195,.22);background:rgba(25,39,61,.86);
 border-radius:11px;padding:10px 15px;font-size:12px;font-weight:700;
 transition:transform .16s,border-color .16s,background .16s,box-shadow .16s
}
.btn:hover{border-color:rgba(174,151,255,.55);background:#22314b;transform:translateY(-1px)}
.btn.primary{
 background:linear-gradient(115deg,#9b7cf4,#6f65d8);border:0;
 box-shadow:0 8px 24px rgba(119,91,221,.25)
}
.btn.primary:hover{background:linear-gradient(115deg,#ad92ff,#7c75e8);box-shadow:0 10px 28px rgba(119,91,221,.34)}
.grid{gap:16px}
.kpi,.panel,.module{
 background:linear-gradient(145deg,rgba(20,32,53,.96),rgba(13,23,39,.96));
 border:1px solid rgba(137,158,193,.17);border-radius:17px;
 box-shadow:0 12px 32px rgba(0,0,0,.12)
}
.kpi{padding:20px;min-height:132px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;width:90px;height:90px;right:-34px;top:-38px;border-radius:50%;background:rgba(157,131,255,.09);filter:blur(2px)}
.kpi-top{font-size:11px;letter-spacing:.02em}
.kpi strong{font-size:32px;margin:17px 0 5px;letter-spacing:-1.4px}
.kpi small{font-size:11px;color:#8294b1}
.panel{padding:21px;margin-top:18px}
.panelhead{margin-bottom:17px}
.panel h2,.module h3{font-size:14px;letter-spacing:-.15px}
.tag{background:rgba(127,147,180,.07);font-size:10px;letter-spacing:.02em}
.cols{gap:18px}
.modules{gap:15px}
.module{padding:19px;transition:transform .18s,border-color .18s,box-shadow .18s}
.module:hover{transform:translateY(-3px);border-color:rgba(166,144,255,.36);box-shadow:0 16px 34px rgba(0,0,0,.2)}
.module .ico{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:rgba(157,131,255,.12);border:1px solid rgba(157,131,255,.18);font-size:19px}
.module p{font-size:12px;line-height:1.7;min-height:60px}
.field{
 background:#0b1424;border:1px solid rgba(137,158,193,.22);border-radius:11px;
 padding:11px 13px;font-size:12px;min-height:42px;outline:none;transition:border-color .16s,box-shadow .16s
}
.field:focus{border-color:#9d83ff;box-shadow:0 0 0 3px rgba(157,131,255,.13)}
.tabletools{gap:10px;margin:14px 0 16px}
.tablewrap{border:1px solid rgba(137,158,193,.14);border-radius:13px}
table{min-width:580px}
th,td{padding:14px 15px;font-size:12px}
th{background:rgba(124,146,181,.06);font-size:10px;text-transform:uppercase;letter-spacing:.9px}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(140,124,220,.07)}
.empty{
 padding:28px 22px;border:1px dashed rgba(137,158,193,.28);
 border-radius:14px;background:rgba(11,20,36,.36);font-size:12px
}
.notice{background:rgba(126,99,206,.12);border:1px solid rgba(166,144,255,.22);border-radius:13px;font-size:12px}
.activityrow{padding-bottom:14px}
.toast{background:#1b2940;border:1px solid rgba(166,144,255,.32);box-shadow:0 12px 34px #0006}
.login-card{background:linear-gradient(145deg,#17243a,#0d1728);border:1px solid rgba(137,158,193,.2);box-shadow:0 28px 90px #0008}
.login-card h1{font-size:30px}
@media(max-width:1000px){
 .layout{grid-template-columns:205px minmax(0,1fr);gap:16px}
 .grid{gap:11px}
}
@media(max-width:700px){
 .top{height:64px;padding:0 15px}
 .layout{display:block;padding:16px 13px}
 .sidebar{top:auto;display:flex;gap:4px;margin-bottom:20px;border-radius:14px}
 .navbtn{min-height:40px;padding:9px 12px;font-size:12px}
 .pagehead{align-items:flex-start;margin-bottom:20px}
 .pagehead h1{font-size:25px}
 .panel{padding:15px;margin-top:14px}
 .kpi{min-height:112px}
 .kpi strong{font-size:26px}
 .modules{gap:10px}
 .module{padding:14px}
}
@media(max-width:420px){
 .topright{gap:6px;font-size:10px}
 .brand{font-size:17px}
 .grid{gap:8px}
 .kpi{padding:12px}
 .kpi strong{font-size:22px}
 .modules{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.review-cover{width:58px;height:78px;border-radius:8px;overflow:hidden;background:#202538;border:1px solid var(--line,#343b50);display:grid;place-items:center;color:#9aa4b8;font-size:10px;text-align:center}.review-cover img{width:100%;height:100%;object-fit:cover;display:block}.review-cover span{padding:4px}
</style>

<header class="top"><div class="brand">MANHWA <span>HUB</span> <small style="font-size:10px;color:#8290aa;letter-spacing:1px">CMS</small></div><div class="topright"><span id="who">Memeriksa sesi…</span><button class="btn" id="logout">Keluar</button></div></header>

<script>
(()=>{"use strict";
const $=s=>document.querySelector(s),content=$("#content"),db=window.manwhahubSupabase;
const coverProxyBase="https://lvbtxofhumoxvhwiqend.supabase.co/functions/v1/cover-proxy?url=";
let active="dashboard",sessionUser=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(s){const t=$("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300)}
function fmt(n){return Number(n||0).toLocaleString("id-ID")}
async function count(table){const {count,error}=await db.from(table).select("*",{count:"exact",head:true});if(error)throw error;return count||0}
async function guard(){
 if(!db)throw new Error(window.manwhahubConnectionError||"Supabase belum terhubung.");
 const {data,error}=await db.auth.getUser();if(error||!data?.user)throw new Error("Sesi login tidak valid. Silakan masuk kembali.");
 const {data:profile,error:pe}=await db.from("profiles").select("role").eq("id",data.user.id).maybeSingle();if(pe)throw pe;
 sessionUser=data.user;
 if(profile?.role!=="admin")throw new Error("Akun ini belum memiliki role admin pada tabel profiles.");
 $("#who").textContent=data.user.email||"Administrator";
}
function head(kicker,title,desc,action=""){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${desc}</p></div>${action}</div>`}
function module(icon,title,desc,button,view){return `<article class="module"><div class="ico">${icon}</div><h3>${title}</h3><p>${desc}</p><button class="btn" data-module="${view}">${button}</button></article>`}
async function dashboard(){
 content.innerHTML=head("OVERVIEW","Dashboard","Ringkasan operasional Manhwa Hub berdasarkan data yang benar-benar tersedia.")+`<div class="grid" id="kpis"><div class="kpi">Memuat statistik…</div></div><div class="cols"><section class="panel"><div class="panelhead"><h2>Analytics & growth</h2><span class="tag warn">Event tracking belum dipasang</span></div><div class="empty">Grafik views, active users, watch sessions, retention, dan perbandingan periode belum ditampilkan karena event analytics belum tersedia. Angka tidak akan dibuat-buat.</div></section><section class="panel"><div class="panelhead"><h2>Operational health</h2><span class="tag">Live checks</span></div><div id="health" class="activity"><div class="activityrow"><i class="dot"></i><div><b>Supabase client</b><small>Memeriksa koneksi…</small></div></div></div></section></div><div class="cols"><section class="panel"><div class="panelhead"><h2>Recent activity</h2><span class="tag warn">Belum ada audit event</span></div><div class="empty">Aktivitas admin akan muncul setelah audit log diaktifkan.</div></section><section class="panel"><div class="panelhead"><h2>Pending moderation</h2><span class="tag">Scraper review</span></div><div id="pending" class="empty">Memuat antrean…</div></section></div><section class="panel"><div class="panelhead"><h2>Dashboard widgets</h2><span class="tag">Role-based access</span></div><div class="modules">${module("▣","Project & scraper","Pantau scraper, import, dan antrean review.","Buka Project","project")}${module("▤","Master data","Kelola katalog manhwa, chapter, dan aset.","Buka Master Data","master")}${module("◈","Editor Admin","Moderasi, homepage, SEO, dan analytics.","Buka Editor Admin","editor")}</div></section>`;
 const [manhwa,chapters,users,pages,pending]=await Promise.all([count("manhwa"),count("chapters"),count("profiles"),count("chapter_pages"),pendingCount()]);
 $("#kpis").innerHTML=[[manhwa,"Total manhwa","Database"],[chapters,"Total chapter","Database"],[users,"Pengguna terdaftar","profiles"],[pages,"Halaman media","chapter_pages"]].map(x=>`<article class="kpi"><div class="kpi-top"><span>${x[1]}</span><span>●</span></div><strong>${fmt(x[0])}</strong><small>${x[2]}</small></article>`).join("");
 $("#pending").innerHTML=`<b style="font-size:24px">${fmt(pending)}</b><p class="muted">Item menunggu pemeriksaan scraper</p><button class="btn" data-view="project">Buka antrean</button>`;
 $("#health").innerHTML=`<div class="activityrow"><i class="dot" style="background:var(--green)"></i><div><b>Supabase</b><small>Terhubung dan query berhasil</small></div></div><div class="activityrow"><i class="dot" style="background:var(--amber)"></i><div><b>Analytics ingestion</b><small>Belum dikonfigurasi</small></div></div><div class="activityrow"><i class="dot" style="background:var(--amber)"></i><div><b>Background jobs / queue</b><small>Belum ada health endpoint</small></div></div>`;
}
async function invokeAdminFunction(name,body){
 const {data,error:sessionError}=await db.auth.getSession();
 if(sessionError)throw sessionError;
 const token=data?.session?.access_token;
 if(!token)throw new Error("Sesi admin tidak memiliki access token. Silakan login ulang.");
 const result=await db.functions.invoke(name,{body,headers:{Authorization:"Bearer "+token}});
 if(result.error){
  const response=result.error.context;
  let detail="";
  if(response&&typeof response.clone==="function"){try{detail=await response.clone().text()}catch(_){}}
  const status=response?.status?("HTTP "+response.status+" "+(response.statusText||"")):"";
  throw new Error(["Edge Function "+name,status,detail].filter(Boolean).join(" — ")||result.error.message);
 }
 return result;
}
async function pendingCount(){const {count,error}=await db.from("scraped_manhwa").select("*",{count:"exact",head:true}).eq("status","pending");if(error){console.warn(error);return 0}return count||0}
async function project(){
 content.innerHTML=head("PROJECT WORKSPACE","Project","Pengelolaan sumber data, proses scraping, import, dan pemeriksaan metadata.")+`<div class="grid"><article class="kpi"><div class="kpi-top">Scraper</div><strong>Multi-source</strong><small>Edge Function</small></article><article class="kpi"><div class="kpi-top">Review queue</div><strong id="projectPending">—</strong><small>Pending metadata</small></article><article class="kpi"><div class="kpi-top">Scheduler</div><strong>Terpisah</strong><small>Cron / Edge Function</small></article><article class="kpi"><div class="kpi-top">Source validation</div><strong>Manual</strong><small>Perlu health check</small></article></div><section class="panel"><div class="panelhead"><h2>Scraper import</h2><span class="tag">Existing integration</span></div><form id="scrapeForm" class="tabletools"><input class="field search" name="query" required placeholder="Cari judul manhwa…"><select class="field" name="source"><option value="ratumanhwa">RatuManhwa</option><option value="komiku">Komiku</option></select><button class="btn primary">Jalankan scraper</button></form><p id="scrapeMsg" class="statusline">Hasil akan masuk antrean pending, bukan langsung dipublikasikan.</p></section><section class="panel"><div class="panelhead"><h2>Scraper review queue</h2><button class="btn" id="reloadQueue">Muat ulang</button></div><div id="queue" class="empty">Memuat antrean…</div></section>`;
 $("#projectPending").textContent=fmt(await pendingCount());$("#scrapeForm").onsubmit=runScraper;$("#reloadQueue").onclick=loadQueue;await loadQueue();

async function runScraper(e){e.preventDefault();const f=new FormData(e.currentTarget),msg=$("#scrapeMsg"),btn=e.submitter;try{await guard();btn.disabled=true;msg.textContent="Scraper sedang berjalan…";const {data,error}=await invokeAdminFunction("multi-source-scraper",{query:String(f.get("query")).trim(),sources:[String(f.get("source"))]});if(error)throw error;if(!data?.success)throw new Error(data?.message||data?.error||"Scraper gagal");msg.textContent=`Selesai: ditemukan ${data.total??data.found??0}, disimpan ${data.saved??0}, duplikat ${data.skipped??0}. Periksa antrean sebelum publish.`;await loadQueue()}catch(err){msg.textContent="Gagal: "+err.message}finally{btn.disabled=false}}

if(!db){showLogin(window.manwhahubConnectionError||"Supabase belum terhubung. Periksa supabase.js.")}else{db.auth.onAuthStateChange((_event,session)=>{sessionUser=session?.user||null;render()});render()}
})();
