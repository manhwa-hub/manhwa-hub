/* ===== MANHWA HUB — modern visual refresh ===== */
:root{
  --bg:#090b13;--panel:#111522;--panel2:#191f30;--text:#f6f4ff;
  --muted:#a3abc2;--line:#252d42;--accent:#b18aff;--accent2:#8054e8;
  --good:#55dfb0;--danger:#ff718c;--radius:18px;
}
body{
  background:
    radial-gradient(ellipse at 12% 0%,rgba(111,73,184,.16),transparent 34rem),
    radial-gradient(ellipse at 92% 18%,rgba(48,103,156,.10),transparent 30rem),
    var(--bg);
  letter-spacing:.005em;
}
.topbar{
  height:74px;background:rgba(10,12,21,.82);border-bottom-color:rgba(159,143,211,.14);
  box-shadow:0 8px 30px rgba(0,0,0,.14);
}
.logo{font-size:23px;letter-spacing:-1.25px}
.logo span{color:#bd9bff}
.nav{gap:22px}
.nav button{font-size:13px;transition:color .2s,background .2s}
.nav button.active{color:#fff;position:relative}
.nav button.active:after{
  content:"";position:absolute;left:0;right:0;bottom:-17px;height:2px;
  background:linear-gradient(90deg,#a77aff,#d7bfff);border-radius:5px;
}
.iconbtn,.btn,.field{border-radius:12px;transition:all .2s ease}
.iconbtn,.btn{box-shadow:0 3px 12px rgba(0,0,0,.12)}
.btn.primary{
  background:linear-gradient(135deg,#9b70f2,#7045d2);
  border-color:transparent;box-shadow:0 7px 20px rgba(128,84,232,.24);
}
.btn.primary:hover{transform:translateY(-1px);filter:brightness(1.1);box-shadow:0 10px 24px rgba(128,84,232,.32)}
.btn:not(.primary):hover,.iconbtn:hover{border-color:#66538e;background:#24283b}
.container{padding-top:30px}
.hero{
  min-height:370px;padding:clamp(28px,5vw,58px);
  background:
    linear-gradient(105deg,rgba(16,15,31,.98) 0%,rgba(37,27,65,.94) 55%,rgba(20,27,48,.92) 100%);
  border:1px solid rgba(191,160,255,.23);
  box-shadow:0 24px 70px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.05);
}
.hero:after{
  width:430px;height:430px;right:4%;top:-35px;opacity:.72;
  background:radial-gradient(circle at 35% 32%,#f0dfff 0%,#b48bff 17%,#8052d9 38%,#3b286b 62%,transparent 72%);
  filter:blur(2px);
}
.hero-content{max-width:600px}
.eyebrow{letter-spacing:2.5px;font-size:11px}
.hero h1{letter-spacing:-2.2px}
.hero p{font-size:15px;color:#d5cde8}
.section{margin-top:44px}
.section-head{margin-bottom:20px}
.section h2{letter-spacing:-.55px}
.grid{gap:19px}
.card{transition:transform .22s ease}
.card:hover{transform:translateY(-5px)}
.cover{
  height:230px;border-radius:15px;
  box-shadow:inset 0 -100px 75px -48px #080812,0 8px 24px rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.07);
  transition:box-shadow .22s,border-color .22s;
}
.card:hover .cover{border-color:rgba(190,158,255,.55);box-shadow:inset 0 -100px 75px -48px #080812,0 15px 32px rgba(0,0,0,.3)}
.cover:before{opacity:.8}
.cover:after{opacity:.75}
.cover-title{letter-spacing:-.45px}
.card h3{font-size:13px;letter-spacing:.05px;margin-top:12px}
.meta{line-height:1.5}
.tag{backdrop-filter:blur(8px);background:rgba(12,12,24,.35)}
.pill{border:1px solid rgba(177,138,255,.15)}
.toolbar{gap:11px}
.field{
  background:rgba(18,22,35,.9);border-color:#2b334a;
  padding:12px 14px;color:var(--text);
}
.field:focus{border-color:#a783f5;box-shadow:0 0 0 3px rgba(167,131,245,.12)}
.empty{
  background:linear-gradient(145deg,#141827,#10131f);
  border-color:#30364b;border-radius:16px;
}
.detail{
  background:linear-gradient(145deg,#151a29,#10131e);
  border-color:#2b3248;box-shadow:0 16px 45px rgba(0,0,0,.16);
}
.detail .cover{height:330px}
.detail h1{letter-spacing:-1px}
.chapter-list{border-color:#30364b}
.chapter{transition:background .18s}
.chapter:hover{background:#1a2030}
.notice{border:1px solid rgba(177,138,255,.16);background:rgba(89,62,139,.19)}
.stat,.admin-panel,.side{
  background:linear-gradient(145deg,#151a29,#111522);
  border-color:#2b3248;border-radius:16px;
}
.stat b{letter-spacing:-1px}
.table-wrap table{border-spacing:0}
th{font-weight:650}
td,th{padding:14px}
.modal{
  background:linear-gradient(145deg,#171c2b,#111522);
  border-color:#353b52;box-shadow:0 25px 90px rgba(0,0,0,.5);
}
.modal-backdrop{backdrop-filter:blur(7px)}
.toast{box-shadow:0 10px 35px rgba(0,0,0,.3)}
.footer{border-color:rgba(159,143,211,.14)}
.login-short{display:none}
button:focus-visible,[data-open]:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid #b99aff;outline-offset:3px;
}
@media(max-width:900px){
  .grid{gap:15px}.cover{height:210px}
}
@media(max-width:650px){
  .topbar{height:64px;background:rgba(10,12,21,.94)}
  .nav{top:63px;gap:4px;box-shadow:0 15px 30px rgba(0,0,0,.25)}
  .nav button.active:after{display:none}
  .top-actions .login-label{display:none}
  .top-actions .login-short{display:inline}
  .container{padding-top:18px}
  .hero{min-height:350px;border-radius:20px}
  .hero:after{right:-155px;top:5px;width:340px;height:340px;opacity:.34}
  .hero h1{letter-spacing:-1.4px}
  .grid{gap:13px}
  .cover{height:175px;border-radius:12px}
  .detail{border-radius:15px}
  .detail .cover{height:175px}
  .section{margin-top:35px}
}
@media(max-width:380px){
  .cover{height:190px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}


/* Detail & reader experience refinement */
.detail-v2{align-items:start;position:relative;overflow:hidden}
.detail-v2:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,#9b72ef,#5e9bdb,transparent)}
.detail-v2 .cover{width:100%;max-width:260px;height:350px;border-radius:14px;box-shadow:0 18px 40px #0006}
.detail-copy{min-width:0;padding:4px 0}
.detail-copy .eyebrow{letter-spacing:.16em;font-size:10px;font-weight:800;color:#b99aff}
.detail-copy .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail-copy p{max-width:760px;color:#c4c9d8}
.detail-copy .toolbar{margin-top:20px}
.chapter-section{margin-top:30px}
.chapter-section .section-head{align-items:center}
.chapter-list{box-shadow:0 12px 30px #0002}
.chapter{min-height:72px;padding:14px 18px}
.chapter>div{min-width:0}
.chapter b{display:block;overflow-wrap:anywhere}
.chapter .meta{margin-top:4px}
.chapter .btn{min-width:76px}
.reader{max-width:820px;text-align:initial}
.reader-toolbar{position:sticky;top:12px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;margin:0 0 16px;border:1px solid #343b52;border-radius:16px;background:rgba(16,21,34,.94);backdrop-filter:blur(16px);box-shadow:0 12px 30px #0004}
.reader-chapter-heading{display:flex;flex-direction:column;gap:3px;min-width:0}
.reader-chapter-heading .eyebrow{font-size:9px;letter-spacing:.16em;color:#b99aff;font-weight:800}
.reader-chapter-heading b{font-size:16px;overflow-wrap:anywhere}
.reader-select{width:min(250px,45%);margin:0}
.reader-page-wrap{margin:0 auto 10px;max-width:760px;background:#090b12;scroll-margin-top:92px;contain:content}
.reader-page-wrap.image-loading{min-height:180px;background:linear-gradient(110deg,#151a29 8%,#252d42 18%,#151a29 33%);background-size:200% 100%;animation:readerShimmer 1.35s linear infinite}
.reader-image{display:block;width:100%;height:auto;max-width:760px;min-height:120px;margin:auto;object-fit:contain;background:#090b12;content-visibility:auto}
.reader-image.image-failed{display:none}
.reader-image-error{padding:28px 16px;text-align:center;color:#f0b5b5;font-size:13px;background:#211820;border:1px solid #553440}
@keyframes readerShimmer{to{background-position:-200% 0}}
.reader-progress{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 14px;margin:0 0 14px;border:1px solid #343b52;border-radius:13px;background:rgba(16,21,34,.94)}
.reader-progress-track{grid-column:1/-1;height:6px;border-radius:20px;background:#30364b;overflow:hidden}
.reader-progress-fill{height:100%;width:0;background:linear-gradient(90deg,#9b70f2,#55dfb0);border-radius:20px;transition:width .2s ease}
.reader-page-controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0}
.reader-page-controls .field{width:105px;padding:9px}
.reader-page-controls .btn{padding:9px 12px}
@media(max-width:640px){.reader-progress{padding:10px}.reader-page-controls{gap:7px;position:sticky;bottom:8px;z-index:4;background:rgba(16,21,34,.96);border:1px solid #343b52;border-radius:13px;padding:9px;box-shadow:0 8px 24px #0005;backdrop-filter:blur(12px)}.reader-page-controls .btn{font-size:12px;min-height:40px}.reader-page-controls .field{min-height:40px}.reader-page-wrap{scroll-margin-top:82px}.reader-image{min-height:90px}}

.reader-caption{text-align:center;padding:8px 4px 12px}
.reader-navigation{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 30px;margin-top:12px;border-top:1px solid var(--line)}
.reader-navigation .btn{min-width:130px}
.reader-navigation .btn:disabled{opacity:.35;cursor:not-allowed}
@media(max-width:640px){
 .detail-v2{grid-template-columns:104px minmax(0,1fr);gap:14px;padding:14px}
 .detail-v2 .cover{height:154px;max-width:none;border-radius:10px}
 .detail-copy{padding:0}
 .detail-copy h1{font-size:20px;line-height:1.2;overflow-wrap:anywhere}
 .detail-copy p{font-size:12px;line-height:1.55;grid-column:1/-1}
 .detail-copy .toolbar{gap:7px;margin-top:12px}
 .detail-copy .toolbar .btn{font-size:11px;padding:9px 10px}
 .chapter{padding:12px;min-height:66px}
 .reader-toolbar{top:6px;padding:11px;gap:8px}
 .reader-chapter-heading b{font-size:13px}
 .reader-select{width:44%;min-width:112px;font-size:12px}
 .reader-navigation{gap:7px}
 .reader-navigation .btn{min-width:0;padding:10px 11px;font-size:12px}
}
@media(max-width:380px){
 .detail-v2{grid-template-columns:1fr}
 .detail-v2 .cover{width:120px;height:170px}
 .detail-copy p{font-size:13px}
}


/* Real cover art: load from the title's AniList manga entry when an exact title match is found. */
.cover{isolation:isolate;background:linear-gradient(145deg,var(--c1),var(--c2));}
.cover-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%;opacity:0;transition:opacity .25s ease;z-index:0}
.cover.has-image .cover-art{opacity:1}
.cover.has-image:before{display:none}
.cover.has-image:after{display:none}
.cover-caption{position:relative;z-index:2;width:100%;padding-top:48px}
.cover.has-image .cover-caption{background:linear-gradient(0deg,rgba(5,7,14,.94),rgba(5,7,14,.45) 65%,transparent);margin:-13px;padding:48px 13px 13px}
.cover.has-image .cover-title{font-size:16px}
@media(max-width:600px){.cover-art{object-position:center 15%}.cover.has-image .cover-caption{padding-top:42px}}


/* ADMIN DASHBOARD — usability and mobile polish */
.admin-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 22px;padding:14px;background:linear-gradient(135deg,rgba(125,82,210,.13),rgba(37,52,83,.18));border:1px solid var(--line);border-radius:16px}
.admin-search{position:relative;flex:1 1 260px;max-width:460px}
.admin-search>span{position:absolute;left:13px;top:50%;transform:translateY(-52%);font-size:23px;color:var(--muted);pointer-events:none}
.admin-search .field{padding-left:42px;margin:0;min-height:44px}
.admin-jumps{display:flex;gap:8px;flex-wrap:wrap}
.admin-jumps .btn{white-space:nowrap}
.admin-panel{scroll-margin-top:18px}
.admin-panel h2{display:flex;align-items:center;gap:9px;margin:0 0 15px;font-size:18px}
.admin-panel .form{max-width:760px}
.admin-panel .field{min-height:44px}
.admin-panel textarea.field{min-height:100px}
.admin-panel table tbody tr{transition:background .16s}
.admin-panel table tbody tr:hover{background:rgba(150,120,220,.08)}
.admin-panel table tbody tr[hidden]{display:none}
.admin-stats .stat{background:linear-gradient(145deg,#191d30,#121725);border-color:#303650}

<div class="app">

    <button data-page="home" class="active">Beranda</button><button data-page="catalog">Katalog</button><button data-page="bookmark">Bookmark</button><button data-page="history">Riwayat</button>
  </nav>
  <div class="top-actions"><button class="iconbtn" id="themeBtn" title="Ganti tema">☼</button><button class="btn primary small" id="loginBtn"><span class="login-label">Masuk / Daftar</span><span class="login-short">Masuk</span></button></div>
</header>
<main class="container" id="main"></main>
<footer class="footer">© 2026 MANHWA HUB · Prototype tampilan · Konten contoh untuk demonstrasi</footer>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const main=$("#main");
const db=window.manwhahubSupabase;
const initial=[
{id:1,title:"The Beginning After The End",genre:["Fantasy","Action"],status:"Ongoing",rating:"9.8",chapters:12,desc:"Seorang raja bereinkarnasi ke dunia penuh sihir dan petualangan. Ikuti perjalanan barunya menemukan arti keluarga dan kekuatan.",colors:["#7651b5","#182b4d"],badge:"POPULER"},
{id:2,title:"Solo Leveling",genre:["Action","Fantasy"],status:"Completed",rating:"9.9",chapters:15,desc:"Pemburu terlemah mendapatkan kesempatan untuk berkembang tanpa batas melalui sistem misterius.",colors:["#1e527e","#101323"],badge:"TOP RATED"},
{id:3,title:"Omniscient Reader",genre:["Fantasy","Drama"],status:"Ongoing",rating:"9.7",chapters:10,desc:"Dunia novel yang dibaca seorang pekerja kantoran tiba-tiba menjadi kenyataan.",colors:["#8d4c58","#24203c"],badge:"TRENDING"},
{id:4,title:"Eleceed",genre:["Action","Comedy"],status:"Ongoing",rating:"9.5",chapters:9,desc:"Pemuda berhati baik dan kekuatan super bertemu dengan sosok misterius yang unik.",colors:["#397c87","#152e45"],badge:""},
{id:5,title:"Tower of God",genre:["Adventure","Fantasy"],status:"Ongoing",rating:"9.4",chapters:11,desc:"Perjalanan mendaki menara misterius demi menemukan seseorang yang sangat berarti.",colors:["#a17a42","#392b50"],badge:""},
{id:6,title:"The Great Mage Returns",genre:["Magic","Action"],status:"Ongoing",rating:"9.2",chapters:8,desc:"Penyihir legendaris kembali setelah ratusan tahun dan menghadapi dunia yang berubah.",colors:["#4c4d9c","#18213c"],badge:""},
{id:7,title:"Lookism",genre:["Drama","Action"],status:"Ongoing",rating:"9.1",chapters:7,desc:"Kehidupan sekolah, identitas, dan konflik sosial dalam kisah dua penampilan.",colors:["#ad6250","#35243e"],badge:""},
{id:8,title:"Return of the Mount Hua",genre:["Martial Arts","Comedy"],status:"Ongoing",rating:"9.6",chapters:13,desc:"Pendekar legendaris terlahir kembali untuk membangun ulang sektenya.",colors:["#4c805f","#183b3a"],badge:""}
];
let mangas=initial;
let bookmarks=JSON.parse(localStorage.getItem("mh_bookmarks")||"[]");
let history=JSON.parse(localStorage.getItem("mh_history")||"[]");
let currentPage="home", currentId=null, currentChapter=1, readerIndex=1, user=null, dark=true;
let readerPageObserver=null;
const save=()=>{localStorage.setItem("mh_bookmarks",JSON.stringify(bookmarks));localStorage.setItem("mh_history",JSON.stringify(history));};
const coverColors=[["#7651b5","#182b4d"],["#1e527e","#101323"],["#8d4c58","#24203c"],["#397c87","#152e45"],["#a17a42","#392b50"],["#4c4d9c","#18213c"],["#ad6250","#35243e"],["#4c805f","#183b3a"]];
async function loadManhwaFromDatabase(){
 if(!db){toast("Supabase belum terhubung. Menampilkan data demo.");return}
 main.innerHTML='<div class="empty">Mengambil katalog dari database Supabase...</div>';
 try{
  const {data,error}=await db.from("manhwa").select("*, chapters(count)");
  if(error)throw error;
  mangas=(data||[]).map((row,index)=>({
   id:row.id,title:row.title,genre:Array.isArray(row.genres)?row.genres:[],
   status:({ongoing:"Ongoing",completed:"Completed",hiatus:"Hiatus"}[row.status]||row.status),
   rating:"9.0",chapters:row.chapters?.[0]?.count||0,
   desc:row.synopsis||"Belum ada sinopsis.",
   colors:coverColors[index%coverColors.length],badge:index<3?["POPULER","TOP RATED","TRENDING"][index]:"",
   type:row.type,slug:row.slug,cover_url:row.cover_url||""
  }));
  if(!mangas.length)toast("Database belum memiliki judul manhwa.");
 }catch(error){
  console.error("Gagal memuat katalog Supabase:",error);
  toast("Katalog gagal dimuat: "+(error.message||"Periksa koneksi dan kebijakan RLS."));
 }
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200)}
const coverLookupCache=new Map();
const coverAliases={
 "Omniscient Reader":["Omniscient Reader's Viewpoint","Omniscient Reader"],
 "The Great Mage Returns":["The Great Mage Returns After 4000 Years","The Archmage Returns After 4000 Years"],
 "Return of the Mount Hua":["Return of the Blossoming Blade","Return of the Mount Hua Sect"]
};
async function lookupAniListCover(title){
 if(coverLookupCache.has(title))return coverLookupCache.get(title);
 const task=(async()=>{
  const query=`query ($search: String) { Media(search: $search, type: MANGA) { title { english romaji native } coverImage { extraLarge large } } }`;
  const norm=v=>(v||"").toLowerCase().normalize("NFKD").replace(/[’']/g,"").replace(/[^a-z0-9]+/g," ").trim();
  const wanted=[title,...(coverAliases[title]||[])];
  for(const term of wanted){
   try{
    const response=await fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({query,variables:{search:term}})});
    if(!response.ok)continue;
    const payload=await response.json(),media=payload?.data?.Media;if(!media)continue;
    const names=[media.title?.english,media.title?.romaji,media.title?.native].filter(Boolean).map(norm);
    const expected=norm(term);
    if(names.some(n=>n===expected)){
     const image=media.coverImage?.extraLarge||media.coverImage?.large||null;
     if(image)return image;
    }
   }catch(error){console.info("Pencarian cover dilewati:",term);}
  }
  return null;
 })();
 coverLookupCache.set(title,task);return task;
}
function hydrateCoverImages(){
 document.querySelectorAll(".cover[data-cover-title]").forEach(async el=>{
  if(el.dataset.coverReady==="1")return;el.dataset.coverReady="1";
  const title=el.dataset.coverTitle;let url=el.dataset.coverUrl||await lookupAniListCover(title);
  if(!url)return;
  const img=el.querySelector(".cover-art");if(!img)return;
  img.onload=()=>el.classList.add("has-image");img.onerror=()=>{img.removeAttribute("src");};img.src=url;
 });
}
function cover(m){return `<div class="cover" data-cover-title="${esc(m.title)}" data-cover-url="${esc(m.cover_url||"")}" style="--c1:${m.colors?.[0]||"#51447d"};--c2:${m.colors?.[1]||"#171a2c"}"><img class="cover-art" alt="Cover ${esc(m.title)}" loading="lazy"><div class="cover-caption"><span class="tag">${esc(m.badge||m.status)}</span><div class="cover-title">${esc(m.title)}</div></div></div>`}
function card(m){return `<article class="card" data-open="${m.id}">${cover(m)}<h3>${esc(m.title)}</h3><div class="meta">★ ${m.rating||"9.0"} · ${m.status}</div></article>`}
function setPage(p){currentPage=p;$("#nav").classList.remove("open");document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
function render(){
 document.body.classList.toggle("admin-mode",currentPage==="admin");
 if(currentPage==="home") home();
 else if(currentPage==="catalog") catalog();
 else if(currentPage==="bookmark") listing("bookmark");
 else if(currentPage==="history") listing("history");
 else if(currentPage==="detail") detail();
 else if(currentPage==="reader") reader();
 else if(currentPage==="profile") profile();
 else if(currentPage==="admin") admin();
 hydrateCoverImages();
}

async function reader(){

async function loadScraperReviewQueue(){
 const box=$("#scraperReviewList");if(!box)return;
 box.innerHTML='<p class="meta">Memuat antrean pemeriksaan...</p>';
 try{
  await requireAdmin();
  const {data,error}=await db.functions.invoke("review-scraped-manhwa",{body:{action:"list"}});
  if(error)throw error;
  if(!data?.success)throw new Error(data?.message||"Gagal mengambil antrean review.");
  const rows=Array.isArray(data.data)?data.data:[];
  if(!rows.length){box.innerHTML='<div class="empty">Belum ada hasil scraper yang menunggu pemeriksaan.</div>';return;}
  box.innerHTML='<div class="grid">'+rows.map(item=>{
   const genres=Array.isArray(item.genres)?item.genres.join(", "):"";
   const cover=item.cover_url?'<img src="'+esc(item.cover_url)+'" alt="" loading="lazy" style="width:76px;height:100px;object-fit:cover;border-radius:9px">':'';
   return '<article class="section" style="padding:13px;margin:0 0 12px"><div style="display:flex;gap:12px;align-items:flex-start">'+cover+'<div style="min-width:0;flex:1"><h3 style="margin:0 0 7px">'+esc(item.title||"Tanpa judul")+'</h3><p class="meta" style="margin:0 0 7px">'+esc(item.source_id||"Sumber tidak diketahui")+'</p><p style="font-size:13px;line-height:1.5;margin:0 0 7px">'+esc(item.description||"Tidak ada sinopsis.")+'</p><p class="meta">'+esc(genres||"Genre belum tersedia")+'</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn primary small" type="button" data-scraper-review="approved" data-review-id="'+esc(item.id)+'">Setujui & terbitkan</button><button class="btn small" type="button" data-scraper-review="rejected" data-review-id="'+esc(item.id)+'">Tolak</button></div></div></div></article>';
  }).join("")+'</div>';
  box.querySelectorAll("[data-scraper-review]").forEach(btn=>btn.addEventListener("click",async()=>{
   const id=btn.dataset.reviewId,status=btn.dataset.scraperReview;
   const label=status==="approved"?"Menyetujui...":"Menolak...";
   btn.disabled=true;btn.textContent=label;
   try{
    const {data,error}=await db.functions.invoke("review-scraped-manhwa",{body:{action:"review",id:Number(id),status}});
    if(error)throw error;
    if(!data?.success)throw new Error(data?.message||"Pemeriksaan gagal.");
    toast(status==="approved"?"Hasil scraper diterbitkan ke katalog.":"Hasil scraper ditolak.");
    await loadScraperReviewQueue();
   }catch(error){btn.disabled=false;btn.textContent=status==="approved"?"Setujui & terbitkan":"Tolak";toast("Gagal: "+(error.message||"Pemeriksaan gagal."));}
  }));
 }catch(error){
  console.error("Scraper review queue:",error);
  box.innerHTML='<div class="notice">Gagal memuat pemeriksaan: '+esc(error.message||"Periksa Edge Function review-scraped-manhwa.")+'</div>';
 }
}
async function runBotScraper(e){
 e.preventDefault();
 const form=e.currentTarget,msg=$("#botScraperMsg"),submit=$("#botScraperSubmit");
 const f=new FormData(form),query=String(f.get("query")||"").trim(),source=String(f.get("source")||"komiku");
 try{
  await requireAdmin();
  if(!query)throw new Error("Masukkan kata kunci judul.");
  submit.disabled=true;submit.textContent="Bot sedang mencari...";
  msg.textContent="Menghubungi scraper "+source+" untuk mencari: "+query;
  const {data,error}=await db.functions.invoke("multi-source-scraper",{body:{mode:"admin",query,sources:[source]}});
  if(error)throw error;
  if(!data?.success)throw new Error(data?.message||"Bot Scraper gagal dijalankan.");
  const total=Number(data.total||0),saved=Number(data.saved||0),skipped=Number(data.skipped||0);
  const details=Array.isArray(data.errors)&&data.errors.length?" Catatan: "+data.errors.map(x=>x.message||x.error||"Kesalahan sumber").join("; "):"";
  msg.textContent="Selesai. Ditemukan: "+total+". Baru disimpan: "+saved+". Duplikat dilewati: "+skipped+". Semua data baru berstatus pending."+details;
  await loadScraperReviewQueue();
  toast("Bot Scraper selesai. Antrean pemeriksaan sudah diperbarui.");
 }catch(error){
  console.error("Bot Scraper:",error);
  msg.textContent="Gagal: "+(error.message||"Periksa Edge Function multi-source-scraper.");
 }finally{
  submit.disabled=false;submit.textContent="Jalankan Bot Scraper";
 }
}
async function runKomikuChapterImport(e){
 e.preventDefault();
 const form=e.currentTarget,msg=$("#komikuImportMsg"),submit=$("#komikuImportSubmit");
 const f=new FormData(form);
 const payload={
  manhwa_id:String(f.get("manhwa_id")||""),
  slug:String(f.get("slug")||"").trim(),
  offset:Math.max(0,Number(f.get("offset")||0)),
  limit:Math.min(10,Math.max(1,Number(f.get("limit")||5)))
 };
 try{
  await requireAdmin();
  if(!payload.manhwa_id||!payload.slug)throw new Error("Pilih judul dan isi slug Komiku.");
  submit.disabled=true;submit.textContent="Mengimpor...";
  msg.textContent="Mengambil daftar chapter dan halaman dari Komiku...";
  const {data,error}=await db.functions.invoke("komiku-chapter-import",{body:payload});
  if(error)throw error;
  if(!data?.success)throw new Error(data?.message||"Impor chapter gagal.");
  const summary=`Selesai: ${data.processed} diproses · ${data.chaptersCreated} chapter baru · ${data.pagesCreated} halaman baru · ${data.chaptersSkipped} dilewati.`;
  const nextOffset=data.nextOffset;
  const hasMore=!!data.hasMore;
  await admin();
  const refreshed=$("#komikuImportForm");
  if(refreshed){
   refreshed.elements.manhwa_id.value=payload.manhwa_id;
   refreshed.elements.slug.value=payload.slug;
   refreshed.elements.offset.value=hasMore?nextOffset:0;
   refreshed.elements.limit.value=String(payload.limit);
  }
  const resultMsg=$("#komikuImportMsg");
  if(resultMsg)resultMsg.textContent=summary+(hasMore?` Batch berikutnya dimulai dari urutan ${nextOffset}.`:" Semua chapter pada sumber sudah diperiksa.");
  toast(hasMore?"Batch impor selesai. Lanjutkan batch berikutnya.":"Impor chapter selesai.");
 }catch(error){
  console.error("Komiku chapter import:",error);
  msg.textContent="Gagal: "+(error.message||"Periksa Edge Function komiku-chapter-import.");
 }finally{
  const currentSubmit=$("#komikuImportSubmit");
  if(currentSubmit){currentSubmit.disabled=false;currentSubmit.textContent="Mulai impor chapter";}
 }
}

 try{
  await requireAdmin();
  if(!chapterId)throw new Error("Pilih chapter terlebih dahulu.");
  if(!files.length)throw new Error("Pilih minimal satu gambar.");
  if(files.length>50)throw new Error("Maksimal 50 gambar dalam satu kali upload.");
  const invalid=files.find(f=>!["image/jpeg","image/png","image/webp"].includes(f.type));
  if(invalid)throw new Error(`Format ${invalid.name} tidak didukung. Gunakan JPG, PNG, atau WEBP.`);
  const oversized=files.find(f=>f.size>15*1024*1024);
  if(oversized)throw new Error(`${oversized.name} lebih besar dari 15 MB.`);
  msg.textContent="Memeriksa nomor halaman...";
  const {data:existing,error}=await db.from("chapter_pages").select("page_number").eq("chapter_id",chapterId).order("page_number",{ascending:false}).limit(1);
  if(error)throw error;
  let pageNumber=(existing?.[0]?.page_number||0)+1;
  const submit=form.querySelector('button[type="submit"],button:not([type])');
  if(submit){submit.disabled=true;submit.textContent="Mengunggah...";}
  try{
   for(let i=0;i<files.length;i++){
    const file=files[i],number=pageNumber+i;
    msg.textContent=`Mengunggah ${i+1}/${files.length}: halaman ${number} — ${file.name}`;
    const url=await uploadToChapterBucket(file,"pages");
    const {error:insertError}=await db.from("chapter_pages").insert({chapter_id:chapterId,page_number:number,image_url:url});
    if(insertError)throw new Error(`Gagal menyimpan halaman ${number} (${file.name}): ${insertError.message}`);
    success++;
   }
  }finally{if(submit){submit.disabled=false;submit.textContent="Unggah Halaman";}}
  msg.textContent=`Selesai! ${success} dari ${files.length} gambar berhasil diunggah sebagai halaman ${pageNumber}–${pageNumber+success-1}.`;
  toast(`${success} halaman berhasil diunggah.`);
  form.reset();$("#pageFileInfo").textContent="Belum ada gambar dipilih. Pilih batch gambar berikutnya.";const preview=$("#uploadPreview");if(preview)preview.innerHTML="";
  await loadAdminChapterOptions();
 }catch(error){
  msg.textContent=`Upload terhenti. ${error.message}${success?` ${success} gambar sebelumnya sudah tersimpan; ulangi hanya gambar yang belum terunggah.`:""}`;
 }
}
async function editAdminManhwa(id){
 try{await requireAdmin();const {data:m,error}=await db.from("manhwa").select("*").eq("id",id).single();if(error)throw error;
 showModal(`<div class="modal-head"><h2>Edit Manhwa</h2><button class="iconbtn" data-close>✕</button></div><form class="form" id="editManhwaForm"><label>Judul<input class="field" name="title" required value="${esc(m.title)}"></label><label>Slug<input class="field" name="slug" required value="${esc(m.slug)}"></label><label>Sinopsis<textarea class="field" name="synopsis">${esc(m.synopsis||"")}</textarea></label><label>Penulis<input class="field" name="author" value="${esc(m.author||"")}"></label><label>Ilustrator<input class="field" name="artist" value="${esc(m.artist||"")}"></label><label>Jenis<select class="field" name="type"><option value="manhwa" ${m.type==="manhwa"?"selected":""}>Manhwa</option><option value="manhua" ${m.type==="manhua"?"selected":""}>Manhua</option><option value="manga" ${m.type==="manga"?"selected":""}>Manga</option></select></label><label>Status<select class="field" name="status"><option value="ongoing" ${m.status==="ongoing"?"selected":""}>Ongoing</option><option value="completed" ${m.status==="completed"?"selected":""}>Completed</option><option value="hiatus" ${m.status==="hiatus"?"selected":""}>Hiatus</option></select></label><label>Genre, pisahkan koma<input class="field" name="genres" value="${esc((m.genres||[]).join(", "))}"></label><label>Tahun rilis<input class="field" name="release_year" type="number" value="${esc(m.release_year||2026)}"></label><label>Ganti cover (opsional)<input class="field" name="cover" type="file" accept="image/*"></label><button class="btn primary">Simpan perubahan</button><p class="meta" id="editManhwaMsg"></p></form>`);
 const form=$("#editManhwaForm");form.onsubmit=async e=>{e.preventDefault();const f=new FormData(form),msg=$("#editManhwaMsg");try{await requireAdmin();const payload={title:String(f.get("title")).trim(),slug:String(f.get("slug")).trim().toLowerCase(),synopsis:String(f.get("synopsis")||""),author:String(f.get("author")||""),artist:String(f.get("artist")||""),type:f.get("type"),status:f.get("status"),genres:String(f.get("genres")||"").split(",").map(x=>x.trim()).filter(Boolean),release_year:Number(f.get("release_year"))||2026};const file=f.get("cover");if(file&&file.size){validateImageFile(file);payload.cover_url=await uploadToChapterBucket(file,"covers");}const {error:updateError}=await db.from("manhwa").update(payload).eq("id",id);if(updateError)throw updateError;closeModal();toast("Manhwa berhasil diperbarui.");await loadManhwaFromDatabase();await admin()}catch(err){msg.textContent="Gagal: "+err.message}};
 }catch(err){toast("Gagal membuka edit: "+err.message)}
}
async function editAdminChapter(id,number,title){
 try{await requireAdmin();showModal(`<div class="modal-head"><h2>Edit Chapter</h2><button class="iconbtn" data-close>✕</button></div><form class="form" id="editChapterForm"><label>Nomor chapter<input class="field" name="number" type="number" min="0" step="0.01" required value="${esc(number)}"></label><label>Judul chapter<input class="field" name="title" value="${esc(title)}"></label><button class="btn primary">Simpan perubahan</button></form>`);$("#editChapterForm").onsubmit=async e=>{e.preventDefault();try{await requireAdmin();const f=new FormData(e.currentTarget);const {error}=await db.from("chapters").update({chapter_number:Number(f.get("number")),title:String(f.get("title")||"").trim()||null}).eq("id",id);if(error)throw error;closeModal();toast("Chapter berhasil diperbarui.");await admin()}catch(err){toast("Gagal: "+err.message)}}}catch(err){toast("Gagal membuka edit: "+err.message)}
}
async function deleteAdminChapter(id){try{await requireAdmin();if(!confirm("Hapus chapter ini beserta data halaman dan riwayat terkait?"))return;const {error}=await db.from("chapters").delete().eq("id",id);if(error)throw error;toast("Chapter berhasil dihapus.");await admin()}catch(err){toast("Gagal menghapus chapter: "+err.message)}}
async function deleteAdminManhwa(id){
 try{await requireAdmin();if(!confirm("Hapus manhwa beserta chapter dan data halaman terkait?"))return;const {error}=await db.from("manhwa").delete().eq("id",id);if(error)throw error;toast("Manhwa berhasil dihapus.");await loadManhwaFromDatabase();await admin();}catch(error){toast("Gagal menghapus: "+error.message)}
}
function addModal(id){let m=mangas.find(x=>x.id===id);showModal(`<div class="modal-head"><h2>${m?"Edit Manhwa":"Tambah Manhwa"}</h2><button class="iconbtn" data-close>✕</button></div><form class="form" id="animeForm"><label>Judul<input class="field" name="title" required value="${esc(m?.title||"")}" placeholder="Judul manhwa"></label><label>Genre<input class="field" name="genre" value="${esc(m?.genre.join(", ")||"Action, Fantasy")}" placeholder="Action, Fantasy"></label><label>Status<select class="field" name="status"><option ${m?.status==="Ongoing"?"selected":""}>Ongoing</option><option ${m?.status==="Completed"?"selected":""}>Completed</option></select></label><label>Jumlah chapter<input class="field" name="chapters" type="number" min="1" value="${m?.chapters||1}"></label><label>Deskripsi<textarea class="field" name="desc">${esc(m?.desc||"")}</textarea></label><button class="btn primary">Simpan</button></form>`);$("#animeForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={id:m?.id||Date.now(),title:f.get("title"),genre:f.get("genre").split(",").map(x=>x.trim()).filter(Boolean),status:f.get("status"),chapters:+f.get("chapters"),desc:f.get("desc"),rating:m?.rating||"9.0",colors:m?.colors||["#6d50a8","#18243c"]};if(m)mangas=mangas.map(x=>x.id===m.id?obj:x);else mangas.unshift(obj);save();closeModal();admin();toast("Data demo berhasil disimpan.")}}
function authModal(){
 if(!db){toast("Supabase belum terhubung. Periksa supabase.js.");return}
 showModal(`<div class="modal-head"><h2>Selamat datang</h2><button class="iconbtn" data-close>✕</button></div><div class="tabs"><button class="btn primary" id="tabLogin">Masuk</button><button class="btn" id="tabReg">Daftar</button></div><form class="form" id="authForm"><label id="authNameWrap" class="hidden">Nama<input class="field" name="name" id="authName" placeholder="Nama kamu"></label><label>Email<input class="field" name="email" type="email" required placeholder="nama@email.com" autocomplete="email"></label><label>Password<input class="field" name="password" type="password" required minlength="8" placeholder="Minimal 8 karakter" autocomplete="current-password"></label><button class="btn primary" id="authSubmit">Masuk</button><button class="btn" type="button" id="resendConfirm">Kirim ulang email konfirmasi</button></form><p id="authMessage" class="meta" aria-live="polite">Gunakan email dan password akun Supabase kamu.</p>`);
 let mode="login";
 const nameWrap=$("#authNameWrap");
 function setMode(x){mode=x;nameWrap.classList.toggle("hidden",x==="login");$("#authName").required=x==="register";$("#tabLogin").classList.toggle("primary",x==="login");$("#tabReg").classList.toggle("primary",x==="register");$("#authSubmit").textContent=x==="login"?"Masuk":"Buat akun";$("#authMessage").textContent=x==="login"?"Masuk menggunakan akun Supabase.":"Daftar menggunakan email aktif. Konfirmasi email mungkin diperlukan."}
 $("#tabLogin").onclick=()=>setMode("login");
 $("#tabReg").onclick=()=>setMode("register");
 $("#authForm").onsubmit=async e=>{
  e.preventDefault();
  const form=e.currentTarget;
  const submit=$("#authSubmit");
  const message=$("#authMessage");
  const f=new FormData(form);
  const mail=String(f.get("email")||"").trim();
  const pass=String(f.get("password")||"");
  submit.disabled=true;message.textContent="Memproses...";
  try{
   let result;
   if(mode==="login"){
    result=await db.auth.signInWithPassword({email:mail,password:pass});
   }else{
    result=await db.auth.signUp({email:mail,password:pass,options:{data:{username:String(f.get("name")||"").trim()},emailRedirectTo:"https://manhwa-hub.github.io/manhwa-hub./"}});
   }
   if(result.error)throw result.error;
   if(mode==="register"&&!result.data.session){
    message.textContent="Pendaftaran berhasil. Silakan periksa email untuk konfirmasi akun, lalu kembali dan login.";
    toast("Periksa email untuk konfirmasi akun.");
   }else{
    closeModal();
    toast(mode==="login"?"Berhasil masuk.":"Akun berhasil dibuat.");
    await refreshAuth();
    render();
   }
  }catch(error){message.textContent="Gagal: "+(error.message||"Terjadi kesalahan.");}
  finally{submit.disabled=false;}
 };
 $("#resendConfirm").onclick=async()=>{
  const mail=String($("#authForm").elements.email.value||"").trim();
  const message=$("#authMessage");
  const button=$("#resendConfirm");
  if(!mail){message.textContent="Masukkan email akun yang didaftarkan terlebih dahulu.";return;}
  button.disabled=true;message.textContent="Mengirim ulang email konfirmasi...";
  try{
   const {error}=await db.auth.resend({type:"signup",email:mail,options:{emailRedirectTo:"https://manhwa-hub.github.io/manhwa-hub./"}});
   if(error)throw error;
   message.textContent="Permintaan kirim ulang berhasil. Periksa Inbox, Spam, dan folder Promosi.";
  }catch(error){message.textContent="Gagal mengirim ulang: "+(error.message||"Terjadi kesalahan.");}
  finally{button.disabled=false;}
 };
}
function mapAuthUser(authUser){
 if(!authUser)return null;
 const metadata=authUser.user_metadata||{};
 return {id:authUser.id,email:authUser.email||"",name:metadata.username||metadata.name||(authUser.email||"Pengguna").split("@")[0]};
}
function updateAuthUI(){
 const button=$("#loginBtn");
 if(!button)return;
 button.querySelector(".login-label").textContent=user?"Profil":"Masuk / Daftar";
 button.querySelector(".login-short").textContent=user?"Profil":"Masuk";
}
async function refreshAuth(){
 if(!db){user=null;updateAuthUI();return}
 const {data,error}=await db.auth.getSession();
 if(error){console.error("Gagal memeriksa sesi:",error.message);return}
 user=mapAuthUser(data.session?.user);
 updateAuthUI();
 if(user)await syncUserLists();
}
async function logout(){
 if(!db){toast("Supabase belum terhubung.");return}
 const {error}=await db.auth.signOut();
 if(error){toast("Logout gagal: "+error.message);return}
 user=null;bookmarks=JSON.parse(localStorage.getItem("mh_bookmarks")||"[]");history=JSON.parse(localStorage.getItem("mh_history")||"[]");updateAuthUI();toast("Kamu sudah keluar.");setPage("home");
}
function showModal(content){$("#modal").innerHTML=content;$("#modalBackdrop").classList.add("show");$("#modal").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal)}
function closeModal(){$("#modalBackdrop").classList.remove("show")}
$("#modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});
$("#nav").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b)setPage(b.dataset.page)});
$("#menuBtn").onclick=()=>$("#nav").classList.toggle("open");
$("#loginBtn").onclick=()=>user?setPage("profile"):authModal();
$("#themeBtn").onclick=()=>{document.body.classList.toggle("light");if(document.body.classList.contains("light")){document.documentElement.style.setProperty("--bg","#f3f3f8");document.documentElement.style.setProperty("--panel","#fff");document.documentElement.style.setProperty("--panel2","#ececf4");document.documentElement.style.setProperty("--text","#191a24");document.documentElement.style.setProperty("--muted","#666b7c");document.documentElement.style.setProperty("--line","#d9dbe5");$("#themeBtn").textContent="☾"}else{["--bg","--panel","--panel2","--text","--muted","--line"].forEach((v,i)=>document.documentElement.style.removeProperty(v));$("#themeBtn").textContent="☼"}};
main.addEventListener("click",e=>{let go=e.target.closest("[data-go]"),open=e.target.closest("[data-open]"),read=e.target.closest("[data-read]"),book=e.target.closest("[data-book]"),del=e.target.closest("[data-delete]"),edit=e.target.closest("[data-edit]"),adminDel=e.target.closest("[data-admin-delete]"),adminEdit=e.target.closest("[data-admin-edit]"),chapterEdit=e.target.closest("[data-chapter-edit]"),chapterDel=e.target.closest("[data-chapter-delete]");if(go)setPage(go.dataset.go);if(open){currentId=open.dataset.open;setPage("detail")}if(read)openReader(read.dataset.read,+read.dataset.ch);if(book){toggleBookmark(book.dataset.book)}if(del){if(confirm("Hapus judul demo ini?")){mangas=mangas.filter(m=>m.id!==del.dataset.delete);save();admin();toast("Judul dihapus.")}}if(edit)addModal(edit.dataset.edit);if(adminDel)deleteAdminManhwa(adminDel.dataset.adminDelete);if(adminEdit)editAdminManhwa(adminEdit.dataset.adminEdit);if(chapterEdit)editAdminChapter(chapterEdit.dataset.chapterEdit,chapterEdit.dataset.number,chapterEdit.dataset.title);if(chapterDel)deleteAdminChapter(chapterDel.dataset.chapterDelete)});
$("#loginBtn .login-short").classList.remove("hidden");
render();
updateAuthUI();
refreshAuth();
if(db){
 db.auth.onAuthStateChange((_event,session)=>{
  user=mapAuthUser(session?.user);
  updateAuthUI();
  if(currentPage==="profile")profile();
 });
}
loadManhwaFromDatabase().then(()=>render());
})();
</script>
